name: Wake Up & Health Check (NP ETF Monitor)

on:
  schedule:
    # 每天保活心跳 (UTC 03:00, 11:00 对应北京时间 11:00, 19:00，覆盖周六周日全天防休眠)
    - cron: '0 3,11 * * *'
    # 交易日关键窗口定时唤醒
    - cron: '45 0 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 8 * * 1-5'
    - cron: '30 12 * * 1-5'
  workflow_dispatch: # 支持由 Cloudflare Workers 秒级外部准时调度触发

jobs:
  wake-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Headless Browser
        run: |
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Run Health Check & Data Fetch
        run: |
          echo "=== 正在唤醒并巡检场内 ETF 监控数据接口 ==="
          python -c "
          import requests
          # 1. 测试腾讯财经 ETF 行情接口
          symbols = 'sh513100,sz159941,sh513500'
          r1 = requests.get(f'http://qt.gtimg.cn/q={symbols}', timeout=10)
          print(f'Tencent ETF API status: {r1.status_code}, data length: {len(r1.content)}')

          # 2. 测试新浪期货行情接口
          r2 = requests.get('http://hq.sinajs.cn/list=hf_NQ,hf_ES,fx_susdcnh', headers={'Referer': 'https://finance.sina.com.cn/'}, timeout=10)
          print(f'Sina Futures API status: {r2.status_code}, data length: {len(r2.content)}')

          # 3. 测试腾讯大盘水位接口
          r3 = requests.get('http://qt.gtimg.cn/q=usNDX,usINX', timeout=10)
          print(f'Tencent Drawdown API status: {r3.status_code}, data length: {len(r3.content)}')

          assert r1.status_code == 200 and r2.status_code == 200 and r3.status_code == 200, 'Data source check failed!'
          print('✅ 所有场内 ETF 与美股雷达数据源正常可用！')
          "

      - name: Wake Up Streamlit Apps via Headless Browser
        run: |
          echo "=== 正在使用 Playwright 真实无头浏览器进行 Streamlit 唤醒与防休眠握手 ==="
          python wake_streamlit.py "https://rqehmildgsfhedt39krz7a.streamlit.app/" "https://qdii-quota-monitor.streamlit.app/"
